[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-recommender"
version = "0.2.0"
description = "Hybrid cultural-event recommendation system (knowledge + graph + trend)"
readme = "README.md"
authors = [{ name = "Rasaswadaya" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
ui = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
include = ["src*"]
